<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356" role="img" aria-labelledby="title desc">
  <title id="title">从论文到完整阅读记录</title>
  <desc id="desc">First Time 精读标题、摘要与结论，Second Time 先整理符号再精读正文并按选择详解图表与公式，Overall Review 总结贡献、证据和边界。各阶段与答疑始终写入同一份 Markdown。动画播放一次，减少动态效果模式显示完整静态内容。</desc>
  <style>
    text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#173b42}
    .serif{font-family:Georgia,"Times New Roman",serif}
    .muted{fill:#526c6c}
    .trace{fill:none;stroke:#b44d2c;stroke-width:2;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:0;animation:connect 1.1s ease both}
    .first{animation-delay:.3s}.second{animation-delay:1.9s}.third{animation-delay:3.5s}
    .ink{opacity:1;animation:write .7s ease both}
    .note-first{animation-delay:1s}.note-second{animation-delay:2.6s}.note-third{animation-delay:4.2s}
    .finish{opacity:1;animation:write .8s ease 5s both}
    @keyframes connect{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
    @keyframes write{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){.trace,.ink,.finish{animation:none;transform:none;opacity:1;stroke-dashoffset:0}}
  </style>
  <rect width="960" height="356" rx="12" fill="#f5f2e9"/>
  <text x="36" y="52" class="serif" font-size="32">Read. Connect. Keep.</text>
  <text x="36" y="79" class="muted" font-size="15">每个阶段的完整解释，汇入同一份阅读记录。</text>
  <g>
    <text x="36" y="137" class="serif" font-size="23">First Time</text>
    <text x="36" y="161" class="muted" font-size="14">标题、摘要与结论精读</text>
    <text x="36" y="210" class="serif" font-size="23">Second Time</text>
    <text x="36" y="234" class="muted" font-size="14">正文精读，图表与公式按需详解</text>
    <text x="36" y="283" class="serif" font-size="23">Overall Review</text>
    <text x="36" y="307" class="muted" font-size="14">贡献、证据与适用边界</text>
  </g>
  <g fill="none" stroke="#d8dfd8" stroke-width="1.2">
    <path d="M308 140H382C462 140 450 166 516 166H591"/>
    <path d="M308 213H591"/>
    <path d="M308 286H382C462 286 450 260 516 260H591"/>
  </g>
  <path class="trace first" d="M308 140H382C462 140 450 166 516 166H591"/>
  <path class="trace second" d="M308 213H591"/>
  <path class="trace third" d="M308 286H382C462 286 450 260 516 260H591"/>
  <rect x="591" y="104" width="333" height="216" rx="8" fill="#fffdf8" stroke="#aabbb4"/>
  <path d="M591 146H924" stroke="#d8dfd8"/>
  <text x="611" y="132" font-size="15" font-weight="600">reading.md</text>
  <text x="901" y="132" text-anchor="end" class="muted" font-size="12">同一份文件</text>
  <g class="ink note-first">
    <text x="611" y="172" font-size="14"># First Time</text>
    <path d="M611 183H878M611 190H813" stroke="#b9c8c1" stroke-width="2"/>
  </g>
  <g class="ink note-second">
    <text x="611" y="221" font-size="14"># Second Time</text>
    <path d="M611 232H878M611 239H849" stroke="#b9c8c1" stroke-width="2"/>
  </g>
  <g class="ink note-third">
    <text x="611" y="270" font-size="14"># Overall Review</text>
    <path d="M611 281H878M611 288H828" stroke="#b9c8c1" stroke-width="2"/>
  </g>
  <text x="924" y="342" text-anchor="end" class="finish muted" font-size="12">每轮答疑，也保存在这里。</text>
</svg>
